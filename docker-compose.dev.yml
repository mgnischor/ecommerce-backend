# Unified Comex Docker Compose stack (DEVELOPMENT).
# This file is intentionally IDENTICAL in the Comex.Backend and
# comex-frontend repositories (services are built from the two sibling
# repositories via relative contexts).
#
#   Frontend: http://localhost:8080   (nginx reverse-proxies /api/* to the backend)
#   Backend:  http://localhost:5049   (direct API access / debugging)
#   Jaeger:   http://localhost:16686
name: comex-dev

services:
    # ── PostgreSQL Database ────────────────────────────────────────────────────
    postgres:
        image: postgres:18.6-trixie
        container_name: comex-postgres-dev
        environment:
            POSTGRES_USER: comex
            POSTGRES_PASSWORD: comex
            POSTGRES_DB: comex
        ports:
            - "5432:5432"
        volumes:
            - postgres-dev-data:/var/lib/postgresql
        networks:
            - comex-network-dev
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U comex"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    # ── Jaeger - Distributed Tracing ───────────────────────────────────────────
    jaeger:
        image: jaegertracing/all-in-one:1.76.0
        container_name: comex-jaeger-dev
        environment:
            - COLLECTOR_OTLP_ENABLED=true
            - LOG_LEVEL=debug
        ports:
            - "16686:16686" # Jaeger UI
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP
            - "14250:14250" # Jaeger gRPC
            - "14268:14268" # Jaeger HTTP
        networks:
            - comex-network-dev
        restart: unless-stopped

    # ── Backend (.NET API) - Development image (SDK + EF tools) ────────────────
    comex-backend-dev:
        build:
            context: ../Comex.Backend
            dockerfile: Dockerfile
            target: development
            args:
                BUILD_DEVELOPMENT: 1
        container_name: comex-backend-dev
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:5049
            - ASPNETCORE_HTTP_PORTS=5049
            - ConnectionStrings__DefaultConnection=Host=postgres;Database=comex;Username=comex;Password=comex;Port=5432
            # JWT signing key (override JWT_SECRET_KEY env var if desired)
            - Jwt__SecretKey=${JWT_SECRET_KEY:-dev-only-secret-key-not-for-production-use-please-rotate-32chars-min}
            - Jwt__Issuer=ComexBackend
            - Jwt__Audience=ComexClient
            - Cors__AllowedOrigins=http://localhost:8080,http://localhost:4200,http://localhost:5049
            - Database__AutoMigrate=true
            - Admin__SeedEnabled=true
            - Admin__Email=${ADMIN_EMAIL:-admin@comex.local}
            - Admin__Password=${ADMIN_PASSWORD:-ChangeMe!Dev#2026}
            - OpenTelemetry__ServiceName=Comex.Backend.Dev
            - OpenTelemetry__ServiceVersion=0.1.25
            - OpenTelemetry__EnableConsoleExporter=true
            - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
        ports:
            - "5049:5049"
        depends_on:
            postgres:
                condition: service_healthy
            jaeger:
                condition: service_started
        networks:
            - comex-network-dev
        restart: unless-stopped

    # ── Frontend (Angular + nginx) ─────────────────────────────────────────────
    comex-frontend-dev:
        build:
            context: ../Comex.Frontend
            dockerfile: Dockerfile
        container_name: comex-frontend-dev
        environment:
            - BACKEND_HOST=comex-backend-dev
            - BACKEND_PORT=5049
        ports:
            - "8080:80"
        depends_on:
            comex-backend-dev:
                condition: service_started
        networks:
            - comex-network-dev
        restart: unless-stopped

volumes:
    postgres-dev-data:
        name: comex-postgres-dev-data

networks:
    comex-network-dev:
        name: comex-network-dev
        driver: bridge
